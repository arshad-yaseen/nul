name: release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the version is derived from `git describe`, which needs the tags
          fetch-depth: 0

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Package
        uses: ./.github/actions/package
        with:
          tag: ${{ github.ref_name }}

      - name: Attest what built them
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            phi-*.tar.xz
            phi-*.zip

      - name: Take the notes from the changelog
        run: |
          set -euo pipefail
          awk -v want="## [${GITHUB_REF_NAME}]" '
            index($0, want) == 1     { inside = 1; next }
            inside && /^## \[/       { exit }
            inside && /^\[[^]]+\]: / { exit }   # the link definitions at the foot
            inside                   { print }
          ' CHANGELOG.md > NOTES.md
          test -s NOTES.md || {
            echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME}" >&2
            exit 1
          }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Phi ${GITHUB_REF_NAME}" \
            --notes-file NOTES.md \
            phi-*.tar.xz phi-*.zip SHA256SUMS index.json
