name = "Nul"
grammar = "nul"
path_suffixes = ["nul"]
line_comments = ["// ", "/// ", "//! "]
tab_size = 4
hard_tabs = false
# A newline can end a statement, so a trailing `;` is rare and the closers are
# what an autoclose should step over.
autoclose_before = ":.,=}])"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "|", end = "|", close = false, newline = false },
]
